services:
  postgres:
    image: postgres:16-alpine
    container_name: aiseekhegaindia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiseek
      POSTGRES_PASSWORD: aiseek
      POSTGRES_DB: aiseekhegaindia
    ports:
      - "5432:5432"
    volumes:
      - aiseek_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiseek -d aiseekhegaindia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aiseek_pg_data:
